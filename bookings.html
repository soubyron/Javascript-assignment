<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookings</title>
</head>
<body>
<form id="booking-form">

    <label for="booking-restaurant">Restaurant</label>
    <select id="booking-restaurant">
        <option value="">Select a restaurant</option>
        <option value="The Green Table">The Green Table</option>
        <option value="Sakura House">Sakura House</option>
        <option value="Spice Garden">Spice Garden</option>
        <option value="The Burger Spot">The Burger Spot</option>
    </select>

    <label for="booking-date">Date</label>
    <input type="date" id="booking-date">

    <label for="booking-time">Time</label>
    <input type="time" id="booking-time">

    <label for="booking-guests">Number of guests</label>
    <input type="number" id="booking-guests" min="1" max="10">

    <button type="submit">Confirm Reservation</button>
    <p id="booking-message"></p>
</form>

<script src="script.js"></script>
</body>
</html>
